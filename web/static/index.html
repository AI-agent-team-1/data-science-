<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Чат с ботом</title>
  <style>
    :root {
      --bg: #e8eaed;
      --surface: #ffffff;
      --border: #dadce0;
      --text: #202124;
      --muted: #5f6368;
      --user: #1a73e8;
      --user-text: #fff;
      --bot-bg: #f1f3f4;
      --error-bg: #fce8e6;
      --error-text: #c5221f;
      --radius: 12px;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
    }

    .app {
      height: 100%;
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      box-shadow: 0 0 0 1px var(--border);
    }

    @media (min-width: 768px) {
      .app {
        height: calc(100% - 32px);
        margin: 16px auto;
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      }
    }

    header {
      flex-shrink: 0;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--surface);
    }

    header h1 {
      font-size: 1.05rem;
      font-weight: 600;
    }

    header .sub {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }

    header button {
      padding: 8px 12px;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
    }

    header button:hover {
      background: var(--bot-bg);
      color: var(--text);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }

    .welcome {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 32px 16px;
      line-height: 1.5;
    }

    .msg {
      max-width: 88%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.45;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }

    .msg.bot {
      align-self: flex-start;
      background: var(--bot-bg);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .msg.bot a {
      color: var(--user);
    }

    .msg.error {
      align-self: center;
      background: var(--error-bg);
      color: var(--error-text);
      font-size: 0.85rem;
      max-width: 100%;
      text-align: center;
    }

    .loading {
      align-self: flex-start;
      padding: 12px 16px;
      background: var(--bot-bg);
      border-radius: 14px;
      border-bottom-left-radius: 4px;
    }

    .dots {
      display: inline-flex;
      gap: 5px;
    }

    .dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9aa0a6;
      animation: pulse 1.3s ease-in-out infinite;
    }

    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.35; transform: scale(0.85); }
      40% { opacity: 1; transform: scale(1); }
    }

    .input-row {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      padding: 12px 16px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .input-row input {
      flex: 1;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }

    .input-row input:focus {
      border-color: var(--user);
    }

    .input-row button[type="submit"] {
      padding: 11px 18px;
      background: var(--user);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .input-row button[type="submit"]:hover:not(:disabled) {
      filter: brightness(1.05);
    }

    .input-row button[type="submit"]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Ассистент</h1>
        <div class="sub">RAG и веб-поиск</div>
      </div>
      <button type="button" id="clear-btn" title="Очистить историю">Очистить чат</button>
    </header>

    <div id="messages"></div>

    <form class="input-row" id="chat-form" autocomplete="off">
      <input id="chat-input" type="text" placeholder="Сообщение…" maxlength="2000" required />
      <button type="submit" id="send-btn">Отправить</button>
    </form>
  </div>

  <script>
    var SESSION_KEY = "llm_bot_web_session_id";

    function randomUUID() {
      if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
        return crypto.randomUUID();
      }
      // HTTP по IP (не secure context) и старые браузеры — randomUUID недоступен
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
        var r = (Math.random() * 16) | 0;
        var v = c === "x" ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      });
    }

    function getSessionId() {
      var id = localStorage.getItem(SESSION_KEY);
      if (!id) {
        id = randomUUID();
        localStorage.setItem(SESSION_KEY, id);
      }
      return id;
    }

    var messagesEl = document.getElementById("messages");
    var form = document.getElementById("chat-form");
    var input = document.getElementById("chat-input");
    var sendBtn = document.getElementById("send-btn");
    var clearBtn = document.getElementById("clear-btn");

    function welcome() {
      var w = document.createElement("div");
      w.className = "welcome";
      w.textContent = "Задайте вопрос — ответит тот же агент, что и в Telegram.";
      messagesEl.appendChild(w);
    }

    function addUser(text) {
      var w = messagesEl.querySelector(".welcome");
      if (w) w.remove();
      var div = document.createElement("div");
      div.className = "msg user";
      div.textContent = text;
      messagesEl.appendChild(div);
      scrollBottom();
    }

    function addBotHtml(html) {
      var div = document.createElement("div");
      div.className = "msg bot";
      div.innerHTML = html.replace(/\n/g, "<br>");
      messagesEl.appendChild(div);
      scrollBottom();
    }

    function addError(text) {
      var div = document.createElement("div");
      div.className = "msg error";
      div.textContent = text;
      messagesEl.appendChild(div);
      scrollBottom();
    }

    function showLoading() {
      var wrap = document.createElement("div");
      wrap.className = "loading";
      wrap.id = "chat-loading";
      var dots = document.createElement("div");
      dots.className = "dots";
      for (var i = 0; i < 3; i++) dots.appendChild(document.createElement("span"));
      wrap.appendChild(dots);
      messagesEl.appendChild(wrap);
      scrollBottom();
    }

    function hideLoading() {
      var el = document.getElementById("chat-loading");
      if (el) el.remove();
    }

    function scrollBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setBusy(on) {
      input.disabled = on;
      sendBtn.disabled = on;
    }

    async function sendMessage(text) {
      addUser(text);
      showLoading();
      setBusy(true);
      try {
        var res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: getSessionId() }),
        });
        hideLoading();
        if (!res.ok) {
          var err = await res.json().catch(function () { return {}; });
          throw new Error(err.detail || ("Ошибка: " + res.status));
        }
        var data = await res.json();
        addBotHtml(data.reply);
      } catch (e) {
        hideLoading();
        addError(e.message || String(e));
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    async function clearChat() {
      try {
        await fetch("/api/clear", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: getSessionId() }),
        });
      } catch (e) {}
      while (messagesEl.firstChild) messagesEl.removeChild(messagesEl.firstChild);
      welcome();
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var t = input.value.trim();
      if (!t) return;
      input.value = "";
      sendMessage(t);
    });

    clearBtn.addEventListener("click", clearChat);

    welcome();
    input.focus();
  </script>
</body>
</html>
