services:
  llm-bot:
    build: .
    container_name: llm-bot
    restart: unless-stopped
    # Один контейнер: Telegram + веб (переопределение CMD из Dockerfile)
    command:
      [
        "/bin/sh",
        "-c",
        "python -u bot.py & exec uvicorn web.api:app --host 0.0.0.0 --port 8000",
      ]
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./docs:/app/docs
      - ./rag_faiss_index:/app/rag_faiss_index
    networks:
      - llm_shared

# Общая сеть с Langfuse (deploy/langfuse): docker network create llm_shared
networks:
  llm_shared:
    external: true
